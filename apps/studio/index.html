    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('mehan-studio-state-v3') ||
            localStorage.getItem('mehan-studio-state-v2');
          var parsed = raw ? JSON.parse(raw) : null;
          var mode =
            parsed && (parsed.mode === 'dark' || parsed.mode === 'light')
              ? parsed.mode
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var lang = parsed && parsed.lang === 'en' ? 'en' : 'id';
          document.documentElement.lang = lang;
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
