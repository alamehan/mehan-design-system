<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" width="960" height="880" role="img" aria-labelledby="mhTitle mhDesc">
  <title id="mhTitle">Why Mehan Design System Exists — Smart Foundation, Original Design Craft</title>
  <desc id="mhDesc">Visual comparison between spending months reinventing fragile UI buttons from scratch versus building original tactile warmth, 35+ workspace components, and practical UX guides on top of Meta Astryx's proven open-source foundation.</desc>
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf9f3"/>
      <stop offset="100%" stop-color="#f7efe2"/>
    </linearGradient>
    <linearGradient id="ctaBerry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e34374"/>
      <stop offset="45%" stop-color="#d42a5f"/>
      <stop offset="100%" stop-color="#b51f4e"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4a2d14" flood-opacity="0.11"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4a2d14" flood-opacity="0.07"/>
    </filter>
    <filter id="rawShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Warm Cream Canvas -->
  <rect width="960" height="880" rx="26" fill="url(#bgPaper)" stroke="#e5d7c4" stroke-width="1.5"/>

  <!-- Top Eyebrow Pill -->
  <rect x="298" y="26" width="364" height="26" rx="13" fill="#efe7ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="480" y="43" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#5b21b6" letter-spacing="0.02em">WHY MEHAN EXISTS · SMART FOUNDATION, ORIGINAL DESIGN CRAFT</text>

  <!-- LEFT TILTED CARD: Rebuilt From Scratch -->
  <g transform="translate(116, 74) rotate(-2.2, 145, 92)" filter="url(#rawShadow)">
    <rect width="290" height="178" rx="16" fill="#f3f2ef" stroke="#b8b2a8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <circle cx="20" cy="20" r="4" fill="#b8b2a8"/>
    <circle cx="32" cy="20" r="4" fill="#b8b2a8"/>
    <circle cx="44" cy="20" r="4" fill="#b8b2a8"/>
    <text x="272" y="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#6b665e">from-scratch-ui.tsx</text>
    <text x="18" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#57534e">Rebuilt from scratch</text>
    <rect x="18" y="61" width="254" height="28" rx="5" fill="#ffffff" stroke="#d6d3cd"/>
    <text x="28" y="79" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">Pretty in mockups, breaks in real use</text>
    <rect x="18" y="99" width="124" height="20" rx="5" fill="#fee2e2"/>
    <text x="80" y="113" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#b91c1c">✗ Months on basics</text>
    <rect x="148" y="99" width="124" height="20" rx="5" fill="#fee2e2"/>
    <text x="210" y="113" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#b91c1c">✗ Fragile menus</text>
    <rect x="18" y="131" width="254" height="31" rx="5" fill="#e5e2dc" stroke="#a8a29e"/>
    <text x="145" y="151" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#57534e">Generic flat look &amp; heavy upkeep</text>
  </g>
  <text x="261" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13.5" fill="#6f5b4d">Hard work alone — months spent reinventing basics</text>

  <!-- HAND-DRAWN CURVED HORIZONTAL ARROW -->
  <path d="M438 164 C 462 144, 496 144, 522 158" fill="none" stroke="#6f5b4d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M512 149 L 524 159 L 510 165" fill="none" stroke="#6f5b4d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RIGHT TILTED CARD: Meta Astryx x Mehan -->
  <g transform="translate(554, 72) rotate(2.2, 145, 92)" filter="url(#cardShadow)">
    <rect width="290" height="178" rx="16" fill="#fffcf7" stroke="#e5d7c4" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="4" fill="#ef4444"/>
    <circle cx="32" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="44" cy="20" r="4" fill="#10b981"/>
    <rect x="150" y="11" width="124" height="19" rx="9.5" fill="#def8eb"/>
    <text x="212" y="24" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#11593d">Meta Astryx × Mehan</text>
    <text x="18" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#261b16">Confectionery · Strawberry</text>
    <!-- Recessed Well -->
    <rect x="18" y="61" width="254" height="29" rx="9" fill="#f2e8d9" stroke="#dfd1be"/>
    <text x="28" y="79" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#261b16">Soft recessed input · Smooth everywhere</text>
    <rect x="18" y="99" width="122" height="20" rx="6" fill="#f2e8d9"/>
    <text x="79" y="113" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#261b16">✓ Meta-proven core</text>
    <rect x="146" y="99" width="126" height="20" rx="6" fill="#f2e8d9"/>
    <text x="209" y="113" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#261b16">✓ Auto Light &amp; Dark</text>
    <!-- 3D Candy Lip Primary Button -->
    <rect x="18" y="130" width="254" height="33" rx="10" fill="#8f163b"/>
    <rect x="18" y="128" width="254" height="32" rx="10" fill="url(#ctaBerry)"/>
    <text x="145" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Warm 3D button · Ready to ship</text>
  </g>
  <text x="699" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="13.5" fill="#b51f4e">Smart craft — proven engine underneath, built with heart on top</text>

  <!-- 5 CONVERGING HAND-DRAWN ARROWS -->
  <g fill="none" stroke="#9b8674" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M366 302 C 374 322, 398 332, 418 350 M408 349 L 419 351 L 418 340"/>
    <path d="M422 300 C 426 320, 440 332, 450 352 M441 347 L 450.5 353 L 454 342"/>
    <path d="M480 298 L 480 354 M473 345 L 480 355 L 487 345"/>
    <path d="M538 300 C 534 320, 520 332, 510 352 M506 342 L 509.5 353 L 519 347"/>
    <path d="M594 302 C 586 322, 562 332, 542 350 M542 340 L 541 351 L 552 349"/>
  </g>

  <!-- CENTERPIECE THESIS HEADLINE (2 Balanced Lines, Zero Edge Clipping) -->
  <text x="480" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#261b16" letter-spacing="-0.02em">
    Why spend months rebuilding basic buttons &amp; dropdowns —
  </text>
  <text x="480" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#261b16" letter-spacing="-0.02em">
    when you can pour 100% of your craft into <tspan font-family="Georgia, serif" font-style="italic" fill="#c81e51">how the product feels</tspan>?
  </text>
  <text x="480" y="436" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c4a3e">
    Built on Meta Astryx (proven across 13,000+ Meta apps), sparked by Shotcandy's warmth, and crafted by Raihan Allaam (@alamehan).
  </text>

  <!-- ATTACHMENT-1 STYLE CONCRETE DISTILLATION SPINE -->
  <!-- Step 1: 100+ -->
  <text x="480" y="484" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="35" font-weight="900" fill="#1d5bbf">100+</text>
  <text x="480" y="503" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#261b16">Proven Core Components (Meta Astryx)</text>
  <path d="M632 489 C 646 487, 656 478, 671 473 M662 470 L 672 473 L 666 481" fill="none" stroke="#6f5b4d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="475" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">Keyboard navigation, accessibility</text>
  <text x="680" y="490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">&amp; AI-agent readiness solved on day one</text>

  <path d="M480 513 C 476 520, 484 527, 480 534" fill="none" stroke="#a38f7e" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Step 2: + 35 -->
  <text x="480" y="562" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="900" fill="#14704e">+ 35</text>
  <text x="480" y="582" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#261b16">Original Workspace &amp; Creative Tools</text>
  <path d="M628 568 C 642 566, 652 557, 667 552 M658 549 L 668 552 L 662 560" fill="none" stroke="#6f5b4d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="554" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">5-in-1 app layouts, charts, color</text>
  <text x="676" y="569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">pickers, code editors &amp; auto-drafts</text>

  <path d="M480 593 C 476 601, 484 609, 480 617" fill="none" stroke="#a38f7e" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Step 3: 12 -->
  <text x="480" y="652" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="900" fill="#9a5206">12</text>
  <text x="480" y="672" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#261b16">Ready-Made Tactile Themes &amp; Color Engine</text>
  <path d="M634 658 C 648 656, 658 647, 673 642 M664 639 L 674 642 L 668 650" fill="none" stroke="#6f5b4d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="682" y="644" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">8 surface moods, offline fonts</text>
  <text x="682" y="659" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">&amp; live docked Theme Editor</text>

  <path d="M480 683 C 476 691, 484 699, 480 707" fill="none" stroke="#a38f7e" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Step 4: 12 -->
  <text x="480" y="742" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="900" fill="#6d28d9">12</text>
  <text x="480" y="762" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#261b16">Practical UX &amp; Interface Writing Guides</text>
  <path d="M628 748 C 642 746, 652 737, 667 732 M658 729 L 668 732 L 662 740" fill="none" stroke="#6f5b4d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="734" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">Uncluttered layouts, forgiving forms</text>
  <text x="676" y="749" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#5c4a3e">&amp; clear bilingual ID / EN copy</text>

  <path d="M480 773 C 476 781, 484 789, 480 797" fill="none" stroke="#a38f7e" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Step 5: = 1 -->
  <text x="480" y="833" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="900" fill="#c81e51">= 1</text>
  <text x="480" y="853" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#261b16">One Complete Design System · AI Chat · React · Tailwind v4 · HTML · Figma</text>
</svg>
